<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Withdrawals | Trend Wave</title>
<style>
:root{--bg:#07172f;--card:#102b4c;--card-border:#234467;--gold:#f5c76b;--muted:#aab6ca;--danger:#ff6b6b;--ok:#70e6a0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:var(--bg);color:#fff;min-height:100vh}

header{background:var(--card);padding:16px 20px;border-bottom:1px solid var(--gold);display:flex;align-items:center;gap:14px}
.back{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--card-border);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
header h2{color:var(--gold);font-size:18px}
header p{color:#bbb;margin-top:3px;font-size:12px}

.container{padding:20px;max-width:700px;margin:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.filters{display:flex;gap:8px;margin-bottom:18px}
.filters button{flex:1;padding:10px 4px;background:var(--card);border:1px solid var(--card-border);color:var(--muted);border-radius:20px;font-size:13px;cursor:pointer}
.filters button.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:bold}

.wd{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px;margin-bottom:12px}
.wd-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--bg);font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;word-break:break-word}
.who small{color:var(--muted);font-size:12px;word-break:break-all}
.amount{color:var(--gold);font-weight:bold;font-size:17px;white-space:nowrap}

.bank{background:var(--bg);border:1px solid var(--card-border);border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.7}
.bank .row{display:flex;justify-content:space-between;gap:12px}
.bank .row span:first-child{color:var(--muted);flex-shrink:0}
.bank .row span:last-child{text-align:right;word-break:break-word}
.copy{margin-top:10px;width:100%;padding:9px;background:transparent;border:1px solid var(--card-border);color:var(--gold);border-radius:8px;font-size:13px;cursor:pointer}

.when{color:var(--muted);font-size:12px;margin-bottom:12px}
.note{font-size:12px;line-height:1.5}
.note.ok{color:var(--ok)}
.note.bad{color:#ff9b9b}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:12px 6px;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;border:1px solid var(--card-border)}
.approve{background:var(--ok);color:#06241a;border-color:var(--ok)!important}
.reject{background:transparent;color:var(--danger);border-color:rgba(255,107,107,.5)!important}

.empty{background:var(--card);border:1px dashed var(--card-border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty .big{font-size:38px;display:block;margin-bottom:12px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:#0a1f3d;border:1px solid var(--card-border);border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .3s ease;z-index:70}
.sheet.show{transform:translate(-50%,0)}
.sheet h3{font-size:18px;margin-bottom:10px}
.sheet p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px}
.sheet textarea{width:100%;min-height:80px;padding:13px;background:var(--card);border:1px solid #34516f;border-radius:8px;color:#fff;font-family:inherit;font-size:15px;outline:none;margin-bottom:16px;resize:vertical}
.sheet textarea:focus{border-color:var(--gold)}
.btn{width:100%;padding:14px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
.btn.green{background:var(--ok);color:#06241a}
.btn.red{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.btn:disabled{opacity:.6;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--card);border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:110;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

#loader{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#12305a 0%,var(--bg) 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;z-index:200;padding:24px;transition:opacity .5s ease,visibility .5s ease}
#loader.hide{opacity:0;visibility:hidden}
.loader-ring{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.loader-ring::before,.loader-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.loader-ring::before{border-top-color:var(--gold);border-right-color:var(--gold);animation:spin 1.1s linear infinite}
.loader-ring::after{inset:10px;border-bottom-color:rgba(245,199,107,.5);border-left-color:rgba(245,199,107,.5);animation:spin 1.8s linear infinite reverse}
.loader-mark{color:var(--gold);font-size:38px;font-weight:bold;animation:pulse 1.6s ease-in-out infinite}
.loader-brand{text-align:center}
.loader-brand h1{font-size:20px;letter-spacing:4px;background:linear-gradient(90deg,#b88a1a,#f5c76b,#fff2c4,#f5c76b,#b88a1a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.2s linear infinite;margin-bottom:8px}
.loader-brand p{color:var(--muted);font-size:12px;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.7}}
@keyframes shine{to{background-position:200% center}}
#denied{display:none;text-align:center;max-width:420px}
#denied h3{color:var(--gold);font-size:20px}
#denied p{color:#bbb;font-size:13px;margin-top:10px;line-height:1.5}
#denied button{max-width:260px;margin:20px auto 0;display:block;background:var(--card);border:1px solid var(--gold);color:var(--gold);padding:15px;border-radius:8px;font-size:15px;width:100%;cursor:pointer}
#loader.denied .loader-ring,#loader.denied .loader-brand{display:none}
#loader.denied #denied{display:block}
#app{visibility:hidden}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"><div class="loader-mark">〆</div></div>
  <div class="loader-brand">
    <h1>TREND WAVE</h1>
    <p>Preparing your dashboard...</p>
  </div>
  <div id="denied">
    <h3 id="deniedTitle"></h3>
    <p id="deniedText"></p>
    <button type="button" id="deniedBtn">Go to login</button>
  </div>
</div>

<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back">‹</button>
    <div>
      <h2>Withdrawals</h2>
      <p id="summary">Administrator Panel</p>
    </div>
  </header>

  <div class="container">
    <div class="filters" id="filters">
      <button data-filter="pending" class="active">Pending</button>
      <button data-filter="paid">Paid</button>
      <button data-filter="rejected">Rejected</button>
    </div>

    <div id="list"></div>

    <div class="empty" id="empty" style="display:none">
      <span class="big">💰</span>
      <span id="emptyText"></span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="decisionSheet">
  <h3 id="decTitle"></h3>
  <p id="decText"></p>
  <textarea id="decNote" placeholder="Reason for rejecting (shown to the user)" maxlength="200" style="display:none"></textarea>
  <button type="button" class="btn" id="decConfirm">Confirm</button>
  <button type="button" class="btn ghost" id="decCancel">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, runTransaction, writeBatch, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3iNjyk71CM0w0TwsI0T4EKlgku4oaUOE",
  authDomain: "trend-wave-d5a7b.firebaseapp.com",
  projectId: "trend-wave-d5a7b",
  storageBucket: "trend-wave-d5a7b.firebasestorage.app",
  messagingSenderId: "403305458793",
  appId: "1:403305458793:web:9df8a535500c403ed0c6f8",
  measurementId: "G-1ZX8YNF81Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "DEKlRtipYTMIaBNkSzMtrGNNFXr2";
const $ = (id) => document.getElementById(id);

let all = [];
let filter = "pending";
let current = null;
let action = null;
let unsubscribe = null;

const naira = (n) => "₦" + Number(n || 0).toLocaleString("en-NG", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const initials = (t) => { const p = (t || "?").trim().split(/\s+/); return ((p[0][0] || "?") + (p[1] ? p[1][0] : "")).toUpperCase(); };

let toastTimer;
function showToast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function fmtDate(ts) {
  if (!ts || !ts.toDate) return "Just now";
  return ts.toDate().toLocaleString("en-NG", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}

/* ---------- Access control ---------- */
function denyAccess(title, detail) {
  $("deniedTitle").textContent = title;
  $("deniedText").textContent = detail;
  $("loader").classList.add("denied");
}
$("deniedBtn").addEventListener("click", async () => {
  try { await signOut(auth); } finally { location.replace("login.html"); }
});
$("backBtn").addEventListener("click", () => { location.href = "admin-dashboard.html"; });

onAuthStateChanged(auth, (user) => {
  if (!user) return denyAccess("Not signed in", "Log in from the same site this page is hosted on.");
  if (user.uid !== ADMIN_UID) return denyAccess("Not an admin", "This account isn't authorised to manage withdrawals.");
  $("app").style.visibility = "visible";
  listen();
  setTimeout(() => $("loader").classList.add("hide"), 900);
});

/* ---------- Load (live) ---------- */
function listen() {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(
    collection(db, "withdrawals"),
    (snap) => {
      all = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const time = (w) => (w.createdAt && w.createdAt.toMillis ? w.createdAt.toMillis() : Date.now());
      all.sort((a, b) => time(b) - time(a));
      render();
    },
    (err) => { console.error(err); showToast("Couldn't load: " + (err.code || "error")); }
  );
}

/* ---------- Render ---------- */
function bankRow(label, value) {
  const row = document.createElement("div");
  row.className = "row";
  const a = document.createElement("span");
  a.textContent = label;
  const b = document.createElement("span");
  b.textContent = value || "—";
  row.append(a, b);
  return row;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("Account number copied");
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); showToast("Account number copied"); }
    catch (err) { showToast("Couldn't copy. Copy it manually."); }
    document.body.removeChild(t);
  }
}

function render() {
  const pending = all.filter((w) => w.status === "pending");
  const total = pending.reduce((sum, w) => sum + (Number(w.amount) || 0), 0);
  $("summary").textContent = pending.length + " pending · " + naira(total);

  const shown = all.filter((w) => w.status === filter);
  const list = $("list");
  list.innerHTML = "";
  $("empty").style.display = shown.length ? "none" : "block";
  $("emptyText").textContent = filter === "pending" ? "No withdrawal requests right now." : "No " + filter + " withdrawals yet.";

  shown.forEach((w) => {
    const card = document.createElement("div");
    card.className = "wd";

    const top = document.createElement("div");
    top.className = "wd-top";
    const av = document.createElement("div");
    av.className = "av";
    av.textContent = initials(w.userName || w.userEmail);
    const who = document.createElement("div");
    who.className = "who";
    const nm = document.createElement("b");
    nm.textContent = w.userName || "User";
    const em = document.createElement("small");
    em.textContent = w.userEmail || w.userId;
    who.append(nm, em);
    const amt = document.createElement("div");
    amt.className = "amount";
    amt.textContent = naira(w.amount);
    top.append(av, who, amt);

    const bank = document.createElement("div");
    bank.className = "bank";
    bank.append(bankRow("Bank", w.bank), bankRow("Account number", w.accountNumber), bankRow("Account name", w.accountName));

    if (w.status === "pending" && w.accountNumber) {
      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy";
      copy.textContent = "Copy account number";
      copy.addEventListener("click", () => copyText(w.accountNumber));
      bank.appendChild(copy);
    }

    const when = document.createElement("div");
    when.className = "when";
    when.textContent = "Requested " + fmtDate(w.createdAt);

    card.append(top, bank, when);

    if (w.status === "pending") {
      const actions = document.createElement("div");
      actions.className = "actions";
      const rej = document.createElement("button");
      rej.className = "reject";
      rej.textContent = "Reject";
      rej.addEventListener("click", () => openDecision(w, "reject"));
      const ok = document.createElement("button");
      ok.className = "approve";
      ok.textContent = "Mark as paid";
      ok.addEventListener("click", () => openDecision(w, "pay"));
      actions.append(rej, ok);
      card.appendChild(actions);
    } else {
      const n = document.createElement("div");
      n.className = "note " + (w.status === "paid" ? "ok" : "bad");
      n.textContent = w.status === "paid"
        ? "Paid · " + fmtDate(w.reviewedAt)
        : "Rejected" + (w.reviewNote ? ": " + w.reviewNote : "") + " · " + fmtDate(w.reviewedAt);
      card.appendChild(n);
    }

    list.appendChild(card);
  });
}

document.querySelectorAll("#filters button").forEach((b) => {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("active", x === b));
    render();
  });
});

/* ---------- Decision sheet ---------- */
function closeSheet() {
  $("overlay").classList.remove("show");
  $("decisionSheet").classList.remove("show");
  current = null;
  action = null;
}
$("overlay").addEventListener("click", closeSheet);
$("decCancel").addEventListener("click", closeSheet);

function openDecision(w, type) {
  current = w;
  action = type;
  const btn = $("decConfirm");

  if (type === "pay") {
    $("decTitle").textContent = "Mark as paid?";
    $("decText").textContent = "Only continue after you've sent " + naira(w.amount) + " to " + (w.accountName || "the user") + " (" + (w.bank || "bank") + " " + (w.accountNumber || "") + "). " + naira(w.amount) + " will be taken from their balance.";
    $("decNote").style.display = "none";
    btn.textContent = "Yes, I've paid " + naira(w.amount);
    btn.className = "btn green";
  } else {
    $("decTitle").textContent = "Reject withdrawal?";
    $("decText").textContent = "Their balance stays the same and they will see it was rejected.";
    $("decNote").style.display = "block";
    $("decNote").value = "";
    btn.textContent = "Reject";
    btn.className = "btn red";
  }

  $("overlay").classList.add("show");
  $("decisionSheet").classList.add("show");
}

$("decConfirm").addEventListener("click", async () => {
  if (!current || !action) return;

  const w = current;
  const type = action;
  const btn = $("decConfirm");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Working...";

  try {
    if (type === "pay") {
      await runTransaction(db, async (tx) => {
        const wRef = doc(db, "withdrawals", w.id);
        const uRef = doc(db, "users", w.userId);
        const tRef = doc(collection(db, "transactions"));

        const wSnap = await tx.get(wRef);
        if (!wSnap.exists() || wSnap.data().status !== "pending") throw new Error("already-reviewed");
        const uSnap = await tx.get(uRef);
        if (!uSnap.exists()) throw new Error("no-user");

        const amount = Number(wSnap.data().amount) || 0;
        const balance = Number(uSnap.data().balance) || 0;
        if (balance < amount) throw new Error("low-balance");

        const last4 = String(wSnap.data().accountNumber || "").slice(-4);

        tx.update(wRef, { status: "paid", reviewedAt: serverTimestamp(), reviewedBy: ADMIN_UID });
        tx.update(uRef, { balance: increment(-amount) });
        tx.set(tRef, {
          userId: w.userId,
          type: "withdrawal",
          title: "Withdrawal to " + (wSnap.data().bank || "bank") + (last4 ? " ****" + last4 : ""),
          amount,
          status: "completed",
          withdrawalId: w.id,
          createdAt: serverTimestamp()
        });
        tx.set(doc(collection(db, "notifications")), {
          userId: w.userId,
          icon: "✅",
          title: "Withdrawal paid",
          text: naira(amount) + " has been sent to your " + (wSnap.data().bank || "bank account") + (last4 ? " (****" + last4 + ")" : "") + ".",
          createdAt: serverTimestamp()
        });
      });
      showToast("Marked as paid");
    } else {
      const note = $("decNote").value.trim();
      const batch = writeBatch(db);
      batch.update(doc(db, "withdrawals", w.id), {
        status: "rejected",
        reviewNote: note,
        reviewedAt: serverTimestamp(),
        reviewedBy: ADMIN_UID
      });
      batch.set(doc(collection(db, "notifications")), {
        userId: w.userId,
        icon: "❌",
        title: "Withdrawal rejected",
        text: "Your " + naira(w.amount) + " withdrawal request was rejected." + (note ? " Reason: " + note + "." : "") + " Your balance was not changed.",
        createdAt: serverTimestamp()
      });
      await batch.commit();
      showToast("Withdrawal rejected");
    }
    closeSheet();
  } catch (err) {
    console.error(err);
    const msg = err.message === "already-reviewed" ? "This request was already handled."
      : err.message === "no-user" ? "This user's account no longer exists."
      : err.message === "low-balance" ? "Their balance is now lower than this amount. Reject it instead."
      : "Couldn't finish: " + (err.code || err.message);
    showToast(msg);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});
</script>
</body>
</html>
